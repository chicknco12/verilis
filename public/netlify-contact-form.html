<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Contact form definition</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p><label>Do not fill this out if you are human: <input name="bot-field"></label></p>
      <p><label>Name: <input type="text" name="name" required></label></p>
      <p><label>Email: <input type="email" name="email" required></label></p>
      <p><label>Organization: <input type="text" name="organization"></label></p>
      <p><label>Role: <input type="text" name="role"></label></p>
      <p><label>What can we help with? <select name="helpWith"><option>Agile Consulting</option><option>Change Management</option><option>Organizational Transformation</option><option>Agile Coaching</option><option>Product Transformation</option><option>Leadership Enablement</option><option>Other</option></select></label></p>
      <p><label>Message: <textarea name="message" required></textarea></label></p>
    </form>
  </body>
</html>
